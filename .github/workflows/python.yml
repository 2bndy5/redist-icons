name: Python

on:
  push:
    branches: [main]
    tags:
      - "mdi/v*"
      - "octicons/v*"
      - "fontawesome/v*"
      - "simple-icons/v*"
    paths:
      - crates/**
      - .github/workflows/python.yml
      - "!crates/*/deno.json"
      - "!crates/*/main.ts"
      - Cargo.toml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - .github/workflows/python.yml
      - "!crates/*/deno.json"
      - "!crates/*/main.ts"
      - Cargo.toml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  get-changed-crates:
    name: Get changed crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.generate-matrix.outputs.crates }}
      uv-groups: ${{ steps.generate-matrix.outputs.uv-groups }}
      pytest-paths: ${{ steps.generate-matrix.outputs.pytest-paths }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/dyn-ci-matrix
        id: generate-matrix
        with:
          nushell-version: ${{ vars.NU_SHELL_VERSION || '*' }}
          is-python-ci: true

  test:
    needs: [get-changed-crates]
    if: needs.get-changed-crates.outputs.crates != '[]'
    name: Test ${{ needs.get-changed-crates.outputs.crates }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup update --no-self-update
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning]
      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: "~/.cargo"
          key: cargo-py-test-${{ hashFiles('Cargo.lock') }}
      - name: Install Python deps
        env:
          UV_GROUPS: ${{ needs.get-changed-crates.outputs.uv-groups }}
        run: uv sync --group test ${UV_GROUPS} --no-dev
      - name: Run Tests
        env:
          PYTEST_PATHS: ${{ needs.get-changed-crates.outputs.pytest-paths }}
        run: uv run --no-sync pytest ${PYTEST_PATHS}

  wheels:
    needs: [get-changed-crates]
    if: needs.get-changed-crates.outputs.crates != '[]'
    runs-on: ${{ matrix.platform.runner }}
    name: >-
      wheels ${{ matrix.pkg }}
      (${{ matrix.python.feature }},
      ${{ matrix.platform.runner }},
      ${{ matrix.platform.manylinux || 'auto'}},
      ${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.get-changed-crates.outputs.crates) }}
        python:
          - version: "3.9"
            feature: pyo3/abi3-py39
          - version: "3.11"
            feature: pyo3/abi3-py311
          - version: "3.15t"
            feature: pyo3/abi3t-py315
        platform:
          - runner: windows-latest
            target: x64
            py-arch: x64
          - runner: windows-latest
            target: x86
            py-arch: x86
          - runner: windows-11-arm
            target: aarch64
            py-arch: arm64
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: x86
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: armv7
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
        exclude:
          # exclude this permutation manually until python 3.11 is the minimum supported python version
          - python:
              version: "3.9"
              feature: pyo3/abi3-py39
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
          - python:
              version: "3.11"
              feature: pyo3/abi3-py311
            platform:
              runner: ubuntu-latest
          - python:
              version: "3.11"
              feature: pyo3/abi3-py311
            platform:
              runner: macos-15
          - python:
              version: "3.11"
              feature: pyo3/abi3-py311
            platform:
              runner: macos-15-intel
          - python:
              version: "3.11"
              feature: pyo3/abi3-py311
            platform:
              runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.platform.py-arch || null }}
          # remove when python 3.15 goes stable
          allow-prereleases: ${{ startsWith(matrix.python.version, '3.15') }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/${{ matrix.pkg }}
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.python.version }}
            --features ${{ matrix.python.feature }}
          # zizmor: ignore[cache-poisoning]
          sccache: ${{ startsWith(github.ref, 'refs/tags') && 'false' || 'true' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.pkg }}-${{ runner.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || '_' }}-${{ matrix.python.version }}
          path: crates/${{ matrix.pkg }}/dist
          if-no-files-found: error

  sdist:
    if: needs.get-changed-crates.outputs.crates != '[]'
    needs: [get-changed-crates]
    name: sdist ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.get-changed-crates.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/${{ matrix.pkg }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.pkg }}-sdist
          path: crates/${{ matrix.pkg }}/dist
          if-no-files-found: error

  release:
    name: Release ${{ matrix.pkg }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [wheels, sdist, test, get-changed-crates]
    permissions:
      # Use for deploying release artifacts via trusted publishing
      id-token: write
    environment: release
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.get-changed-crates.outputs.crates) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-${{ matrix.pkg }}-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, matrix.pkg) }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  check-dist:
    name: Check distribution ${{ matrix.pkg }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: [wheels, sdist, test, get-changed-crates]
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.get-changed-crates.outputs.crates) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-${{ matrix.pkg }}-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Twine check
        run: pipx run twine check dist/*
