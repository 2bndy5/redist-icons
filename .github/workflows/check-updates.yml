name: Check updates and regenerate sources

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check-updates:
    runs-on: ubuntu-latest
    # spell-checker: disable-next-line
    environment: regen-src

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.REDIST_ICONS_UPDATE }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true # needed for git push

      - run: rustup update --no-self-update

      - name: Setup nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: ${{ vars.NU_SHELL_VERSION || '*' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Bun deps
        run: bun install --frozen-lockfile

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Python deps
        run: uv sync

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: "~/.cache/pre-commit"
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check for updates and regenerate sources
        run: nu .github/workflows/check-updates.nu
        env:
          REF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          # used by gh-cli to push / create commits
          GH_TOKEN: ${{ secrets.REDIST_ICONS_UPDATE }}
